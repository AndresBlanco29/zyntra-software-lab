{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Resumen del Pedido</title>
<link rel="stylesheet" href="{% static 'bootstrap/dist/css/bootstrap.min.css' %}">
<script src="{% static 'bootstrap/dist/js/bootstrap.bundle.min.js' %}"></script>

<style>
body { background:#f4f6f9; }

.navbar-custom {
    background: linear-gradient(90deg, #023B82, #0C64CF, #3F89DA);
}

.sidebar {
    background:#fff;
    height:100vh;
    border-right:1px solid #e3e3e3;
}

.sidebar .active {
    background:#1f4fa3 !important;
    color:white !important;
    border-left:4px solid #ffd400;
}

.custom-card {
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.table thead {
    background:#dcdcdc;
}

.btn-yellow {
    background:#ffd400;
    border:none;
    font-weight:600;
}
</style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom">
<div class="container-fluid">
<span class="navbar-brand fw-bold">La Tortilla Grocery</span>
</div>
</nav>

<div class="container-fluid">
<div class="row">

<div class="col-md-2 sidebar p-0">
<div class="p-4">
<h5 class="fw-bold text-primary">Vendedor Andrés</h5>
</div>

    <div class="list-group list-group-flush">

        <a href="{% url 'crear_cliente' %}" 
        class="list-group-item list-group-item-action {% if 'crear-cliente' in request.path %}active{% endif %}">
            Crear Cliente
        </a>

        <a href="{% url 'clientes' %}" 
        class="list-group-item list-group-item-action {% if 'clientes' in request.path %}active{% endif %}">
            Clientes
        </a>

        <a href="{% url 'tomar_pedido' %}" 
        class="list-group-item list-group-item-action {% if 'tomar-pedido' in request.path %}active{% endif %}">
            Tomar Pedido
        </a>

    </div>
</div>

<div class="col-md-10 p-4">

<h3 class="fw-bold">Resumen del Pedido</h3>

<div class="card custom-card p-4 mt-4">

<table class="table align-middle">
<thead>
<tr>
<th>Producto</th>
<th>Presentación</th>
<th>Cantidad</th>
<th>Precio</th>
<th>Subtotal</th>
<th>Acción</th>
</tr>
</thead>

<tbody>
<tr>
<td class="fw-bold">Producto Uno</td>
<td>Caja</td>
<td>5</td>
<td>$90</td>
<td>$450</td>
<td>✏ 🗑</td>
</tr>
</tbody>
</table>

<div class="d-flex justify-content-end mt-4">
<div style="width:300px;">
<p class="d-flex justify-content-between">
<span>Subtotal:</span> <strong>$630</strong>
</p>
<p class="d-flex justify-content-between">
<span>Iva:</span> <strong>-</strong>
</p>
<hr>
<p class="d-flex justify-content-between fs-5">
<span>Total:</span> <strong>$630</strong>
</p>
</div>
</div>

<div class="d-flex justify-content-between mt-4">
<a href="{% url 'tomar_pedido_catalogo' %}" class="btn btn-secondary">
Seguir Agregando Productos
</a>

<button class="btn btn-yellow px-5">
Enviar Pedido
</button>
</div>

</div>

</div>
</div>
</div>

</body>
</html>
