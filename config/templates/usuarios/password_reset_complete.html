{% load static i18n %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% trans "Password updated" %} | La Tortilla Grocery</title>
    <link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">
    <link rel="stylesheet" href="{% static 'bootstrap/dist/css/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
  </head>
  <body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
      <div class="card login-card p-4 text-center">
        <div class="text-center mb-4">
          <img src="{% static 'img/logo.png' %}" class="logo-img mb-2" alt="Logo" />
          <h3 class="fw-bold text-secondary mb-1">La Tortilla Grocery</h3>
        </div>
        <hr />
        <h4 class="fw-bold text-primary">{% trans "Your password has been updated" %}</h4>
        <p class="text-muted mb-3">{% trans "You can now sign in with your new password." %}</p>
        <a href="{% url 'login' %}" class="btn btn-login btn-lg">{% trans "Go to sign in" %}</a>
      </div>
    </div>
  </body>
</html>
