{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | La Tortilla Grocery</title>

    <link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">
    <link rel="apple-touch-icon" href="{% static 'img/logo.png' %}">

    <!-- Bootstrap -->
    <link
      rel="stylesheet"
      href="{% static 'bootstrap/dist/css/bootstrap.min.css' %}"
    />
    <script src="{% static 'bootstrap/dist/js/bootstrap.bundle.min.js' %}"></script>
    <!-- Bootstrap Icons-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{%static 'css/login.css'%}">
    
    

  </head>
  <body>
    <div
      class="container d-flex justify-content-center align-items-center min-vh-100"
    >
      <div class="card login-card p-4">
        <!-- Header -->
        <div class="text-center mb-4">
          <img
            src="{% static 'img/logo.png' %}"
            class="logo-img mb-2"
            alt="Logo"
          />
          <h3 class="fw-bold text-secondary">La Tortilla Grocery</h3>
        </div>

        <hr />

        <!-- Título -->
        <div class="text-center mb-4">
          <h4 class="fw-bold text-primary">Acceso a Plataforma</h4>
          <h6 class="text-muted small">
            Inicia sesión con tu perfil asignado.
          </h6>
        </div>

        <!-- Formulario -->

        {% if messages %} {% for message in messages %}
        <div id="mensaje-error" class="alert alert-danger">{{ message }}</div>
        {% endfor %} {% endif %}

        <form method="POST">
          {% csrf_token %}

          <!-- Email -->
          <div class="mb-3">
            <input
            type="text"
            name="username"
            class="form-control"
            placeholder="Usuario"
            required
            >
          </div>

          <!-- Password -->
          <div class="mb-3 position-relative">
            <input
              type="password"
              name="password"
              id="password"
              class="form-control form-control-lg pe-5"
              placeholder="Contraseña"
              required
            />

            <!-- Icono -->
            <span
              class="position-absolute top-50 end-0 translate-middle-y me-3"
              style="cursor: pointer"
              onclick="togglePassword()"
            >
              <i id="toggleIcon" class="bi bi-eye"></i>
            </span>
          </div>

          <!-- Botón -->
          <div class="d-grid">
            <button type="submit" class="btn btn-login btn-lg">
              Iniciar Sesión
            </button>
          </div>
        </form>

        <!-- Registro -->
        <div class="text-center mt-3">
          <small>
            ¿No tienes cuenta?
            <a href="#" class="fw-bold text-primary">Regístrate</a>
          </small>
        </div>
      </div>
    </div>
    <script src="{%static 'js/login.js'%}"></script>
  </body>
</html>
