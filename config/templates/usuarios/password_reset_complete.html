{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contrasena actualizada | La Tortilla Grocery</title>
    <link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">
    <link rel="stylesheet" href="{% static 'bootstrap/dist/css/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
  </head>
  <body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
      <div class="card login-card p-4 text-center">
        <div class="text-center mb-4">
          <img src="{% static 'img/logo.png' %}" class="logo-img mb-2" alt="Logo" />
          <h3 class="fw-bold text-secondary mb-1">La Tortilla Grocery</h3>
        </div>
        <hr />
        <h4 class="fw-bold text-primary">Tu contrasena fue actualizada</h4>
        <p class="text-muted mb-3">Ahora puedes iniciar sesion con tu nueva contrasena.</p>
        <a href="{% url 'login' %}" class="btn btn-login btn-lg">Ir a iniciar sesion</a>
      </div>
    </div>
  </body>
</html>
