# Zyntra Software Lab — DEMO only. Never point La Tortilla Grocery production at this file.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh scripts/start_demo.sh"
healthcheckPath = "/login/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"

[variables]
MISE_PYTHON_GITHUB_ATTESTATIONS = "false"
DEMO_MODE = "1"
