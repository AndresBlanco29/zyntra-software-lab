{% extends "bases/base_vendedor.html" %}

{% block title %}
Editar Vendedor
{% endblock %}

{% block content %}

<h2 class="mb-4">Editar Vendedor</h2>

<div class="card shadow-sm">
<div class="card-body">

<form method="POST">

{% csrf_token %}

<div class="mb-3">
<label class="form-label">Nombre</label>
<input type="text" name="nombre" class="form-control" value="{{ vendedor.first_name }}" required>
</div>

<div class="mb-3">
<label class="form-label">Apellido</label>
<input type="text" name="apellido" class="form-control" value="{{ vendedor.last_name }}" required>
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" name="email" class="form-control" value="{{ vendedor.email }}" required>
</div>

<div class="mb-3">
<label class="form-label">Teléfono</label>
<input type="text" name="telefono" class="form-control" value="{{ vendedor.telefono }}">
</div>

<div class="mb-3">
<label class="form-label">Usuario</label>
<input type="text" class="form-control" value="{{ vendedor.username }}" disabled>
<small class="text-muted">El nombre de usuario no se puede cambiar</small>
</div>

<button type="submit" class="btn btn-success">
Guardar cambios
</button>

<a href="{% url 'lista_vendedores' %}" class="btn btn-secondary">
Cancelar
</a>

</form>

</div>
</div>

{% endblock %}
