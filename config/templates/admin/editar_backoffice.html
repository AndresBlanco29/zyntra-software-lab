{% extends "bases/base_vendedor.html" %}
{% load i18n %}

{% block title %}
{% trans "Edit BackOffice User" %}
{% endblock %}

{% block content %}

<h2 class="mb-4">{% trans "Edit BackOffice User" %}</h2>

<div class="card shadow-sm">
<div class="card-body">

<form method="POST">

{% csrf_token %}

<div class="mb-3">
<label class="form-label">{% trans "First name" %}</label>
<input type="text" name="nombre" class="form-control" value="{{ usuario_backoffice.first_name }}" required>
</div>

<div class="mb-3">
<label class="form-label">{% trans "Last name" %}</label>
<input type="text" name="apellido" class="form-control" value="{{ usuario_backoffice.last_name }}" required>
</div>

<div class="mb-3">
<label class="form-label">{% trans "Email" %}</label>
<input type="email" name="email" class="form-control" value="{{ usuario_backoffice.email }}" required>
</div>

<div class="mb-3">
<label class="form-label">{% trans "Phone" %}</label>
<input type="text" name="telefono" class="form-control" value="{{ usuario_backoffice.telefono }}">
</div>

<div class="mb-3">
<label class="form-label">{% trans "Username" %}</label>
<input type="text" class="form-control" value="{{ usuario_backoffice.username }}" disabled>
<small class="text-muted">{% trans "The username cannot be changed." %}</small>
</div>

<button type="submit" class="btn btn-success">
{% trans "Save changes" %}
</button>

<a href="{% url 'lista_backoffice' %}" class="btn btn-secondary">
{% trans "Cancel" %}
</a>

</form>

</div>
</div>

{% endblock %}
