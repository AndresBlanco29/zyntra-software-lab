<div class="card shadow-sm mb-3 product-shipment-summary invoice-shipment-summary">
  <div class="card-body">
    <div class="row g-3 align-items-center">
      <div class="col-md-4">
        <div class="invoice-summary-box">
          <span class="invoice-summary-box__label">No. of Cases:</span>
          <span class="invoice-summary-box__value">{{ shipment_summary.total_cases }}</span>
        </div>
      </div>
      <div class="col-md-4">
        <div class="invoice-summary-box">
          <span class="invoice-summary-box__label">Total WGT:</span>
          <span class="invoice-summary-box__value">{{ shipment_summary.total_weight|floatformat:1 }}</span>
        </div>
      </div>
    </div>
  </div>
</div>

  }
