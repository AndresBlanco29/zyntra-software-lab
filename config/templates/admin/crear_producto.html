{% extends "bases/base_vendedor.html" %}

{% block title %}
Crear Producto
{% endblock %}

{% block content %}

<h2 class="mb-4">Crear Producto</h2>

<div class="card shadow-sm">
<div class="card-body">

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<div class="mb-3">
<label class="form-label">Nombre del producto</label>
<input type="text" name="nombre" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Nombre en inglés</label>
<input type="text" name="nombre_en" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Código de Barras <span class="text-danger">*</span></label>
<input type="text" name="codigo_barras" class="form-control" required placeholder="Ej: 7501234567890">
<small class="form-text text-muted">Campo requerido. Debe ser único para cada producto.</small>
</div>

<div class="mb-3">
<label class="form-label">Descripción</label>
<textarea name="descripcion" class="form-control"></textarea>
</div>

<div class="mb-3">
<label class="form-label">Descripción en inglés</label>
<textarea name="descripcion_en" class="form-control"></textarea>
</div>

<div class="mb-3">
<label class="form-label">Categoría</label>
<select name="categoria" class="form-control">
<option value="">Seleccionar categoría</option>

{% for categoria in categorias %}
<option value="{{ categoria.id }}">
{{ categoria.nombre }}
</option>
{% endfor %}

</select>
</div>

<div class="mb-3">
<label class="form-label">Marca</label>
<select name="marca" class="form-control">
<option value="">Seleccionar marca</option>

{% for marca in marcas %}
<option value="{{ marca.id }}">
{{ marca.nombre }}
</option>
{% endfor %}

</select>
</div>

<div class="mb-3">
<label class="form-label">Imagen</label>
<input type="file" name="imagen" class="form-control">
</div>

<div class="mb-3 form-check">
<input type="checkbox" name="activo" class="form-check-input" checked>
<label class="form-check-label">Producto activo</label>
</div>

<div class="mb-3 form-check">
<input type="checkbox" name="destacado" class="form-check-input">
<label class="form-check-label">Producto destacado</label>
</div>

<div class="mb-3">
<label class="form-label">Descuento (%)</label>
<input type="number" name="descuento" class="form-control" value="0">
</div>

<hr class="my-4">

<h5 class="mb-3">Presentación</h5>

<div class="row">

<div class="col-md-4 mb-3">
<label class="form-label">Presentación</label>
<input type="text" name="presentacion" class="form-control" placeholder="Ej: Caja, Bolsa, Pack">
</div>

<div class="col-md-4 mb-3">
<label class="form-label">Tipo de contenido</label>
<input type="text" name="tipo_contenido" class="form-control" placeholder="Ej: Unidades, Libras, Onzas">
</div>

<div class="col-md-4 mb-3">
<label class="form-label">Unidades</label>
<input type="number" name="unidades" class="form-control" placeholder="Ej: 12">
</div>

</div>


<hr class="my-4">

<h5 class="mb-3">Precios</h5>

<div class="row">

<div class="col-md-2 mb-3">
<label class="form-label">Precio 1</label>
<input type="number" step="0.01" name="precio_1" class="form-control">
</div>

<div class="col-md-2 mb-3">
<label class="form-label">Precio 2</label>
<input type="number" step="0.01" name="precio_2" class="form-control">
</div>

<div class="col-md-2 mb-3">
<label class="form-label">Precio 3</label>
<input type="number" step="0.01" name="precio_3" class="form-control">
</div>

<div class="col-md-2 mb-3">
<label class="form-label">Precio 4</label>
<input type="number" step="0.01" name="precio_4" class="form-control">
</div>

<div class="col-md-2 mb-3">
<label class="form-label">Precio 5</label>
<input type="number" step="0.01" name="precio_5" class="form-control">
</div>

</div>

<button type="submit" class="btn btn-success">
Crear producto
</button>

<a href="{% url 'lista_productos' %}" class="btn btn-secondary">
Cancelar
</a>

</form>

</div>
</div>

{% endblock %}
