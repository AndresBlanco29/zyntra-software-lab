{% load static i18n %}
<div style="text-align: center; padding: 1rem 0.5rem;">
  <img
    src="{% if DEMO_MODE %}{% static 'img/zyntra-mark.svg' %}{% else %}{% static 'img/logo.png' %}{% endif %}"
    class="logo-img mb-3{% if DEMO_MODE %} zyntra-mark auth-mark{% endif %}"
    alt="{% if DEMO_MODE %}{{ DEMO_BRAND_NAME }}{% else %}Logo{% endif %}"
    {% if not DEMO_MODE %}style="width: 100px; height: auto;"{% endif %}
  >
  <div style="font-size: 60px; color: #28a745; margin-bottom: 1rem;">
    <i class="bi bi-check-circle"></i>
  </div>
  <h3 style="color: #0b3d91; font-weight: 700; margin-bottom: 1rem;">{% trans "Your password has been updated" %}</h3>
  <p style="color: #475569; margin-bottom: 1.5rem; line-height: 1.6;">
    {% trans "You can now sign in with your new password." %}
  </p>
  <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
    <button type="button" class="btn btn-yellow" onclick="cargarLogin()" style="background: linear-gradient(to right, #ffe600, #c7c700); border: none; color: #1e293b; font-weight: 700; padding: 12px 20px; border-radius: 8px; min-width: 180px;">
      {% trans "Go to sign in" %}
    </button>
    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" style="border: 2px solid #d4d8e2; color: #475569; font-weight: 600; padding: 12px 20px; border-radius: 8px; min-width: 180px;">
      {% trans "Close" %}
    </button>
  </div>
</div>
