# Zyntra Software Lab — DEMO only. Never point La Tortilla Grocery production at this file.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.config.wsgi:application --bind 0.0.0.0:$PORT --timeout 600 --graceful-timeout 120 --access-logfile - --error-logfile -"
healthcheckPath = "/login/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"

[variables]
MISE_PYTHON_GITHUB_ATTESTATIONS = "false"
DEMO_MODE = "1"
