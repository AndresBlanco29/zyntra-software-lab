{% extends "bases/base_vendedor.html" %}
{% load i18n %}

{% block title %}
{% trans "Edit Sales" %}
{% endblock %}

{% block content %}

<h2 class="mb-4">{% trans "Edit Sales" %}</h2>

<div class="card shadow-sm">
<div class="card-body">

<form method="POST">

{% csrf_token %}

<div class="mb-3">
<label class="form-label">{% trans "First name" %}</label>
<input type="text" name="nombre" class="form-control" value="{{ vendedor.first_name }}" required>
</div>

<div class="mb-3">
<label class="form-label">{% trans "Last name" %}</label>
<input type="text" name="apellido" class="form-control" value="{{ vendedor.last_name }}" required>
</div>

<div class="mb-3">
<label class="form-label">{% trans "Email" %}</label>
<input type="email" name="email" class="form-control" value="{{ vendedor.email }}" required>
</div>

<div class="mb-3">
<label class="form-label">{% trans "Phone" %}</label>
<input type="text" name="telefono" class="form-control" value="{{ vendedor.telefono }}">
</div>

<div class="mb-3">
<label class="form-label">{% trans "Username" %}</label>
<input type="text" class="form-control" value="{{ vendedor.username }}" disabled>
<small class="text-muted">{% trans "The username cannot be changed." %}</small>
</div>

<button type="submit" class="btn btn-success">
{% trans "Guardar cambios" %}
</button>

<a href="{% url 'lista_vendedores' %}" class="btn btn-secondary">
{% trans "Cancelar" %}
</a>

</form>

</div>
</div>

{% endblock %}
