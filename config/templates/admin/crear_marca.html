{% extends "bases/base_vendedor.html" %}

{% block title %}
Crear Marca
{% endblock %}

{% block content %}

<h2 class="mb-4">Crear Marca</h2>

<div class="card shadow-sm">
<div class="card-body">

{% if error %}
<div class="alert alert-danger">
{{ error }}
</div>
{% endif %}

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<div class="mb-3">
<label class="form-label">Nombre de la marca</label>
<input type="text" name="nombre" class="form-control" value="{{ nombre|default:'' }}" required>
</div>

<div class="mb-3">
<label class="form-label">Nombre en ingles (opcional)</label>
<input type="text" name="nombre_en" class="form-control" value="{{ nombre_en|default:'' }}">
</div>

<div class="mb-3">
<label class="form-label">Logo (opcional)</label>
<input type="file" name="logo" class="form-control" accept="image/*">
</div>

<div class="mb-3">
<label class="form-label">Categorias asociadas (opcional)</label>
<select name="categorias" class="form-select" multiple size="6">
{% for categoria in categorias %}
<option value="{{ categoria.id }}" {% if categoria.id|stringformat:'s' in selected_categorias %}selected{% endif %}>
{{ categoria.nombre }}
</option>
{% endfor %}
</select>
<small class="text-muted">Mantener presionada Ctrl (o Cmd) para seleccionar varias categorias.</small>
</div>

<div class="d-flex gap-2">
<button type="submit" class="btn btn-success">
Guardar Marca
</button>

<a href="{% url 'lista_marcas' %}" class="btn btn-secondary">
Volver a Marcas
</a>
</div>

</form>

</div>
</div>

{% endblock %}
