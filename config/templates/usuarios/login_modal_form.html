{% load static i18n %}
<!-- FORMULARIO DE LOGIN PARA MODAL -->
<div class="text-center mb-4">
  <img src="{% static 'img/logo.png' %}" class="logo-img mb-2" alt="Logo" style="width: 100px; height: auto;">
  <h3 class="fw-bold text-secondary" style="color: #1e293b; margin-top: 1rem;">{% trans "La Tortilla Grocery" %}</h3>
</div>

<hr>

<div class="text-center mb-4">
  <h4 class="fw-bold text-primary" style="color: #0b3d91;">{% trans "Acceso a Plataforma" %}</h4>
  <h6 class="text-muted small">{% trans "Inicia sesión con tu perfil asignado." %}</h6>
</div>

<form method="POST">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next_url }}">

  <div class="mb-3">
    <label class="form-label" style="font-weight: 600; color: #2c3e50;">{% trans "Usuario" %}</label>
    <input type="text" name="username" class="form-control" placeholder="{% trans 'Ingresa tu usuario' %}" required style="border: 1px solid #d4d8e2; border-radius: 8px; padding: 10px 14px; font-size: 15px;">
  </div>

  <div class="mb-3 position-relative">
    <label class="form-label" style="font-weight: 600; color: #2c3e50;">{% trans "Contraseña" %}</label>
    <input type="password" name="password" id="password" class="form-control" placeholder="{% trans 'Ingresa tu contraseña' %}" required style="border: 1px solid #d4d8e2; border-radius: 8px; padding: 10px 14px; font-size: 15px;">
    <span class="position-absolute top-50 end-0 translate-middle-y me-3" style="cursor: pointer; margin-top: 0.5rem;" onclick="togglePassword()">
      <i id="toggleIcon" class="bi bi-eye"></i>
    </span>
  </div>

  <div class="d-grid mt-4">
    <button type="submit" class="btn btn-yellow" style="background: linear-gradient(to right, #ffe600, #c7c700); border: none; color: #1e293b; font-weight: 700; padding: 12px 20px; border-radius: 8px; font-size: 16px;">
      {% trans "Iniciar Sesión" %}
    </button>
  </div>
</form>

<div class="text-center mt-3">
  <small style="color: #475569; font-size: 14px;">
    {% trans "¿No tienes cuenta?" %}
    <a href="#" class="fw-bold" style="color: #0b3d91; text-decoration: none;" onclick="cargarRegistro(); return false;">{% trans "Regístrate" %}</a>
  </small>
</div>
