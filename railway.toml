# Zyntra Software Lab — DEMO only. Never point La Tortilla Grocery production at this file.
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python manage.py migrate --noinput && python manage.py check_demo_isolation --require-demo && python manage.py collectstatic --noinput && gunicorn config.config.wsgi:application --bind 0.0.0.0:$PORT --timeout 600 --graceful-timeout 120"
healthcheckPath = "/login/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
