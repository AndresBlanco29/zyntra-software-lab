{% load static i18n %}
<div style="text-align: center; padding: 1rem 0.5rem;">
  <img src="{% static 'img/logo.png' %}" class="logo-img mb-3" alt="Logo" style="width: 100px; height: auto;">
  <div style="font-size: 60px; color: #28a745; margin-bottom: 1rem;">
    <i class="bi bi-envelope-check"></i>
  </div>
  <h3 style="color: #0b3d91; font-weight: 700; margin-bottom: 1rem;">{% trans "Revisa tu correo" %}</h3>
  <p style="color: #475569; margin-bottom: 1.5rem; line-height: 1.6;">
    {% trans "Si el correo existe en nuestros registros, te enviaremos un enlace para restablecer tu contraseña." %}
  </p>
  <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
    <button type="button" class="btn btn-yellow" data-bs-dismiss="modal" style="background: linear-gradient(to right, #ffe600, #c7c700); border: none; color: #1e293b; font-weight: 700; padding: 12px 20px; border-radius: 8px; min-width: 180px;">
      {% trans "Cerrar" %}
    </button>
    <button type="button" class="btn btn-outline-secondary" onclick="cargarLogin()" style="border: 2px solid #d4d8e2; color: #475569; font-weight: 600; padding: 12px 20px; border-radius: 8px; min-width: 180px;">
      {% trans "Volver al login" %}
    </button>
  </div>
</div>
