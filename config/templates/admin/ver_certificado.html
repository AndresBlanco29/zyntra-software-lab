{% extends "bases/base_vendedor.html" %}

{% block title %}
Ver Certificado
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
  <div>
    <h2 class="mb-1">Certificado</h2>
    <p class="text-muted mb-0">{{ cliente.nombre_empresa }} - {{ nombre_archivo }}</p>
  </div>
  <a href="{% url 'ver_cliente' cliente.id %}" class="btn btn-outline-secondary">Volver al cliente</a>
</div>

<div class="card shadow-sm border-0">
  <div class="card-body p-2" style="height: 78vh; min-height: 520px;">
    <iframe
      src="{{ certificado_src }}"
      title="Certificado del cliente"
      style="width: 100%; height: 100%; border: 0; border-radius: 10px; background: #f8fafc;"
      loading="eager">
    </iframe>
  </div>
</div>

{% endblock %}
