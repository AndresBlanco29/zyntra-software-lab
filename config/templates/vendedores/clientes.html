{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>

    <link rel="stylesheet" href="{% static 'bootstrap/dist/css/bootstrap.min.css' %}">
    <script src="{% static 'bootstrap/dist/js/bootstrap.bundle.min.js' %}"></script>

    <style>
        body { background-color: #f4f6f9; }

        .navbar-custom {
            background: linear-gradient(90deg, #023B82, #0C64CF, #3F89DA);
        }

        .sidebar {
            background-color: #ffffff;
            height: 100vh;
            border-right: 1px solid #e3e3e3;
        }

        .sidebar .active {
            background-color: #1f4fa3 !important;
            color: white !important;
            border-left: 4px solid #ffd400;
        }

        .custom-card {
            border-radius: 14px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.08);
            border: none;
        }

        .table thead {
            background-color: #e2e2e2;
        }

        .status-active {
            background-color: #28a745;
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold">La Tortilla Grocery</a>
        <div class="ms-auto text-white">Pedido (0)</div>
    </div>
</nav>

<div class="container-fluid">
<div class="row">

<div class="col-md-2 sidebar p-0">
    <div class="p-4">
        <h5 class="fw-bold text-primary">Vendedor Andrés</h5>
    </div>

    <div class="list-group list-group-flush">

        <a href="{% url 'crear_cliente' %}" 
        class="list-group-item list-group-item-action {% if 'crear-cliente' in request.path %}active{% endif %}">
            Crear Cliente
        </a>

        <a href="{% url 'clientes' %}" 
        class="list-group-item list-group-item-action {% if 'clientes' in request.path %}active{% endif %}">
            Clientes
        </a>

        <a href="{% url 'tomar_pedido' %}" 
        class="list-group-item list-group-item-action {% if 'tomar-pedido' in request.path %}active{% endif %}">
            Tomar Pedido
        </a>

    </div>
</div>

<div class="col-md-10 p-4">

<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h3 class="fw-bold mb-0">Clientes</h3>
        <small class="text-muted">Consulta datos del cliente</small>
    </div>

    <div style="width:350px;">
        <input type="search" class="form-control" placeholder="Buscar por nombre, empresa o documento">
    </div>
</div>

<hr>

<div class="d-flex justify-content-center">

<div class="card custom-card w-75">
<div class="card-body p-0">

<table class="table align-middle mb-0">

<thead>
<tr>
    <th>Cliente</th>
    <th>Empresa</th>
    <th>Correo Electrónico</th>
    <th>Teléfono</th>
    <th>Estado</th>
    <th>Acción</th>
</tr>
</thead>

<tbody>
<tr>
    <td class="fw-bold">Juan Pérez</td>
    <td>Tienda Latina</td>
    <td>latiendalatina@gmail.com</td>
    <td>(+1) 555 - 123 - 332</td>
    <td><span class="status-active">Activo</span></td>
    <td><a href="#" class="text-primary fw-semibold">Editar ✏</a></td>
</tr>
</tbody>

</table>

</div>
</div>

</div>

</div>
</div>
</div>

</body>
</html>
